name: CI

on:
  push:
    branches: [main, feature/production-readiness]
  pull_request:
    branches: [main, feature/production-readiness]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint backend
        run: |
          pip install ruff
          ruff check backend/

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Lint frontend
        run: |
          cd frontend
          npm ci
          npm run lint

  build-and-e2e:
    name: Build and E2E
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: echo "OPENAI_API_KEY=" > .env

      - name: Build and start
        run: |
          docker compose build
          docker compose up -d
          sleep 15

      - name: Run E2E test
        run: |
          chmod +x scripts/e2e_test.sh
          BACKEND_URL=http://localhost:8000 ./scripts/e2e_test.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs
